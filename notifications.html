<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniPasta Notifications</title>
<script src="admin-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a0f;color:#d9e6f2;font:14px/1.5 Consolas,"Courier New",monospace}
.shell{width:min(920px,calc(100% - 28px));margin:30px auto}
.card{padding:20px;border:1px solid #233142;background:#0d121a;border-radius:6px;margin-bottom:18px}
h1{margin:0 0 8px;color:#63f5ad}
h2{margin:0 0 14px;color:#55d9ff;font-size:16px}
label{display:block;color:#718297;font-size:11px;margin:12px 0 5px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:11px;border:1px solid #233142;border-radius:4px;background:#0a0f16;color:#d9e6f2;outline:0}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:#55d9ff}
button{padding:10px 14px;border:1px solid #233142;border-radius:4px;background:#111923;color:#d9e6f2;font-weight:800;cursor:pointer}
button:hover{border-color:#55d9ff;color:#55d9ff}
.primary{color:#63f5ad;border-color:#63f5ad66;background:#63f5ad12}
.msg{min-height:20px;margin-top:9px;color:#718297;font-size:12px}
.ok{color:#63f5ad}.error{color:#ff647c}
.notice{padding:12px;border-left:3px solid #63f5ad;background:#63f5ad12;color:#9bb0c3;font-size:12px}
.item{padding:13px;border:1px solid #233142;background:#0a0f16;border-radius:4px;margin-top:8px}
.item strong{display:block;color:#63f5ad}
.item .meta{margin-top:5px;color:#718297;font-size:10px}
.item p{margin:7px 0 0;color:#d9e6f2;white-space:pre-wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
a{color:#55d9ff;text-decoration:none}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div><h1>AniPasta Notifications</h1><div style="color:#718297;font-size:11px">Admin notification publisher</div></div>
    <a href="admin.html">← Admin</a>
  </div>

  <section class="card">
    <h2>CREATE NOTIFICATION</h2>
    <div class="notice">Every notification published here automatically expires after 7 days. Expired notifications are removed by the existing daily cleanup job.</div>
    <label for="title">TITLE</label>
    <input id="title" maxlength="120" placeholder="e.g. New anime update">
    <label for="message">MESSAGE</label>
    <textarea id="message" maxlength="1000" placeholder="Write the notification message..."></textarea>
    <div style="margin-top:12px">
      <button id="publish" class="primary">PUBLISH FOR 7 DAYS</button>
      <button id="refresh">REFRESH</button>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card">
    <h2>ACTIVE / STORED NOTIFICATIONS</h2>
    <div id="list"><div class="notice">Loading...</div></div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var config=window.ANIPASTA_ADMIN_CONFIG||{};
  var db=window.supabase.createClient(config.url,config.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var $=function(id){return document.getElementById(id);};
  var esc=function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');};

  async function load(){
    var r=await db.from('notifications').select('id,title,message,created_at,expires_at,is_active').order('created_at',{ascending:false});
    if(r.error){$('list').innerHTML='<div class="notice error">'+esc(r.error.message)+'</div>';return;}
    var rows=r.data||[];
    $('list').innerHTML=rows.length?rows.map(function(n){
      return '<div class="item"><strong>'+esc(n.title)+'</strong><div class="meta">Created '+esc(new Date(n.created_at).toLocaleString())+' · Expires '+esc(new Date(n.expires_at).toLocaleString())+'</div><p>'+esc(n.message)+'</p></div>';
    }).join(''):'<div class="notice">No notifications yet.</div>';
  }

  async function publish(){
    var title=$('title').value.trim(), message=$('message').value.trim();
    if(!title)return $('msg').textContent='Title is required.',$('msg').className='msg error';
    if(!message)return $('msg').textContent='Message is required.',$('msg').className='msg error';
    $('publish').disabled=true;
    $('publish').textContent='PUBLISHING...';
    try{
      var r=await db.from('notifications').insert({
        title:title,
        message:message,
        expires_at:new Date(Date.now()+7*24*60*60*1000).toISOString(),
        is_active:true
      }).select('id').single();
      if(r.error)throw r.error;
      $('title').value='';
      $('message').value='';
      $('msg').textContent='Notification published. It will expire after 7 days.';
      $('msg').className='msg ok';
      await load();
    }catch(e){
      $('msg').textContent=e.message||'Publish failed.';
      $('msg').className='msg error';
    }finally{
      $('publish').disabled=false;
      $('publish').textContent='PUBLISH FOR 7 DAYS';
    }
  }

  $('publish').addEventListener('click',publish);
  $('refresh').addEventListener('click',load);
  load();
})();
</script>
</body>
</html>
