<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniPasta Admin One-File</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070a0f;color:#dce8f5;font:14px Consolas,monospace}main{max-width:1200px;margin:auto;padding:20px}.box{border:1px solid #263447;background:#0d121a;border-radius:6px;padding:16px;margin-bottom:16px}.row{display:flex;gap:8px}.grow{flex:1}input{width:100%;padding:9px;box-sizing:border-box;background:#0a0f16;color:#fff;border:1px solid #263447;border-radius:4px}button{padding:9px 12px;background:#111923;color:#dce8f5;border:1px solid #263447;border-radius:4px;font-weight:700;cursor:pointer}.ok{color:#63f5ad}.err{color:#ff647c}.list{display:grid;gap:7px}.anime{display:flex;gap:9px;align-items:center;text-align:left}.anime img{width:40px;height:56px;object-fit:cover}.cols{display:grid;grid-template-columns:320px 1fr;gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:9px;background:#0a0f16;border:1px solid #263447;border-radius:4px;margin-top:7px}.muted{color:#7890a6}.hidden{display:none!important}@media(max-width:800px){.cols,.two{grid-template-columns:1fr}}</style></head>
<body><main><div class="box"><b style="color:#63f5ad">ANIPASTA — ADMIN</b><span id="status" style="float:right">● STARTING</span></div><div id="error" class="box hidden"></div><div id="app" class="hidden"><div class="cols"><section><div class="box"><b>LIBRARY</b><div class="row" style="margin-top:10px"><input id="search" class="grow" placeholder="Search anime"><button id="refresh">↻</button></div><div id="library" class="list" style="margin-top:10px"></div></div></section><section><div id="empty" class="box">Select an anime.</div><div id="editor" class="hidden"><div class="box"><h2 id="title" style="color:#63f5ad"></h2><div id="meta" class="muted"></div><div class="row" style="margin-top:10px"><button id="publish">PUBLISH</button><button id="delete" style="color:#ff647c">DELETE</button></div><div id="topMsg" class="muted"></div></div><div class="box"><h3>EPISODES</h3><div class="two"><input id="season" type="number" min="1" value="1"><input id="episode" type="number" min="1" placeholder="Episode"></div><input id="video" style="margin-top:8px" placeholder="Video URL"><div class="row" style="margin-top:8px"><button id="saveEpisode">ADD EPISODE</button><button id="cancel" class="hidden">CANCEL</button></div><div id="epMsg" class="muted"></div><div id="episodes"></div></div><div class="box"><h3>MOVIE</h3><div class="two"><input id="movieUrl" placeholder="Movie video URL"><input id="duration" placeholder="Duration"></div><button id="saveMovie" style="margin-top:8px">SAVE MOVIE</button><div id="movieMsg" class="muted"></div></div><div class="box"><h3>DOWNLOAD LINKS</h3><div class="two"><input id="dSeason" type="number" min="1" value="1"><input id="d480" placeholder="480P link"></div><div class="two" style="margin-top:8px"><input id="d720" placeholder="720P link"><input id="d1080" placeholder="1080P link"></div><div class="row" style="margin-top:8px"><button id="saveDownload">SAVE SEASON</button><button id="clearDownload">CLEAR</button></div><div id="downloadMsg" class="muted"></div><div id="downloads"></div></div></div></section></div></div></main>
<script>
(()=>{'use strict';const URL='https://ctcuocprqbbjkiptjerm.supabase.co',STORE='anipasta_onefile_admin_key';let db,current=null,episodes=[],downloads={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showError(t){$('error').className='box';$('error').textContent=t;$('status').textContent='● ERROR';$('status').className='err'}function key(){let k='';try{k=localStorage.getItem(STORE)||''}catch{}if(!k)k=prompt('Enter your legacy Supabase service_role key');if(k)try{localStorage.setItem(STORE,k)}catch{}return (k||'').trim()}async function init(){try{if(!window.supabase?.createClient)throw Error('Supabase library did not load.');const k=key();if(!k)throw Error('No admin key supplied.');db=window.supabase.createClient(URL,k,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});$('status').textContent='● DATABASE ONLINE';$('status').className='ok';$('app').className='';await loadLibrary()}catch(e){showError(e.message||String(e))}}async function loadLibrary(){const r=await db.from('anime').select('id,title,poster_url,is_published,content_type,movie_url,movie_duration').order('title');if(r.error)throw r.error;renderLibrary(r.data||[])}function renderLibrary(rows){const q=$('search').value.trim().toLowerCase();rows=rows.filter(x=>String(x.title||'').toLowerCase().includes(q));$('library').innerHTML=rows.map(a=>`<button class="anime" data-id="${esc(a.id)}"><img src="${esc(a.poster_url||'')}" alt=""><span><b>${esc(a.title)}</b><br><small class="muted">${esc(a.content_type||'series')} · ${a.is_published?'published':'hidden'}</small></span></button>`).join('')||'<div class="muted">No anime found.</div>'}async function openAnime(id){const r=await db.from('anime').select('*').eq('id',id).single();if(r.error)throw r.error;current=r.data;downloads=norm(r.data.download_links);$('empty').className='hidden';$('editor').className='';$('title').textContent=r.data.title||'';$('meta').textContent=(r.data.content_type||'series').toUpperCase()+' · '+(r.data.is_published?'PUBLISHED':'HIDDEN');$('publish').textContent=r.data.is_published?'UNPUBLISH':'PUBLISH';$('movieUrl').value=r.data.movie_url||'';$('duration').value=r.data.movie_duration||'';await loadEpisodes();renderDownloads()}function norm(v){if(!v)return{};if(typeof v==='object')return v;try{const x=JSON.parse(v);return x&&typeof x==='object'?x:{}}catch{return{}}}async function loadEpisodes(){const r=await db.from('episodes').select('*').eq('anime_id',current.id).order('season').order('episode');if(r.error)throw r.error;episodes=r.data||[];renderEpisodes()}function renderEpisodes(){const seasons=[...new Set(episodes.map(x=>Number(x.season)||1))].sort((a,b)=>a-b);if(seasons.length&&!seasons.includes(Number($('season').value)))$('season').value=seasons[0];const s=Number($('season').value);$('episodes').innerHTML=episodes.filter(x=>Number(x.season)===s).map(x=>`<div class="item"><b>EP ${esc(x.episode)}</b> <span class="muted">${esc(x.video_url||'')}</span> <button data-edit="${esc(x.id)}">EDIT</button> <button data-del="${esc(x.id)}" style="color:#ff647c">DELETE</button></div>`).join('')||'<div class="muted">No episodes.</div>'}async function saveEpisode(){const s=Number($('season').value),e=Number($('episode').value),v=$('video').value.trim();if(!Number.isInteger(s)||s<1||!Number.isInteger(e)||e<1||!v)return $('epMsg').textContent='Season, episode and video URL are required.';const p={anime_id:current.id,season:s,episode:e,video_url:v};const r=await (editing?db.from('episodes').update(p).eq('id',editing):db.from('episodes').insert(p));if(r.error)return $('epMsg').textContent=r.error.message;$('epMsg').textContent=editing?'Episode updated.':'Episode added.';editing=null;$('saveEpisode').textContent='ADD EPISODE';$('cancel').className='hidden';$('video').value='';await loadEpisodes()}let editing=null;async function editEpisode(id){const e=episodes.find(x=>String(x.id)===String(id));if(!e)return;editing=e.id;$('season').value=e.season;$('episode').value=e.episode;$('video').value=e.video_url||'';$('saveEpisode').textContent='SAVE EPISODE';$('cancel').className=''}async function delEpisode(id){if(!confirm('Delete episode?'))return;const r=await db.from('episodes').delete().eq('id',id);if(r.error)return $('epMsg').textContent=r.error.message;await loadEpisodes()}async function saveMovie(){const r=await db.from('anime').update({movie_url:$('movieUrl').value.trim(),movie_duration:$('duration').value.trim()}).eq('id',current.id);$('movieMsg').textContent=r.error?r.error.message:'Movie saved.'}async function toggle(){const next=!current.is_published;const r=await db.from('anime').update({is_published:next}).eq('id',current.id);if(r.error)return $('topMsg').textContent=r.error.message;current.is_published=next;$('publish').textContent=next?'UNPUBLISH':'PUBLISH';$('meta').textContent=(current.content_type||'series').toUpperCase()+' · '+(next?'PUBLISHED':'HIDDEN')}async function delAnime(){if(!confirm('Delete anime and its episodes?'))return;let r=await db.from('episodes').delete().eq('anime_id',current.id);if(r.error)return alert(r.error.message);r=await db.from('anime').delete().eq('id',current.id);if(r.error)return alert(r.error.message);current=null;$('editor').className='hidden';$('empty').className='box';await loadLibrary()}function renderDownloads(){const ks=Object.keys(downloads).filter(k=>/^\d+$/.test(k)).sort((a,b)=>a-b);$('downloads').innerHTML=ks.length?ks.map(s=>{const r=downloads[s]||{};return `<div class="item"><b>Season ${esc(s)}</b><div class="muted">480p: ${esc(r['480p']||'Not added')}</div><div class="muted">720p: ${esc(r['720p']||'Not added')}</div><div class="muted">1080p: ${esc(r['1080p']||'Not added')}</div><button data-dedit="${esc(s)}">EDIT</button><button data-ddel="${esc(s)}" style="color:#ff647c">DELETE</button></div>`}).join(''):'<div class="muted">No download links.</div>'}async function saveDownload(){const s=Number($('dSeason').value);const row={'480p':$('d480').value.trim(),'720p':$('d720').value.trim(),'1080p':$('d1080').value.trim()};if(!Number.isInteger(s)||s<1||!Object.values(row).some(Boolean))return $('downloadMsg').textContent='Season and at least one link are required.';downloads={...downloads,[String(s)]:row};const r=await db.from('anime').update({download_links:downloads}).eq('id',current.id);$('downloadMsg').textContent=r.error?r.error.message:'Download links saved.';renderDownloads()}async function delDownload(s){if(!confirm('Delete Season '+s+' download links?'))return;const n={...downloads};delete n[s];const r=await db.from('anime').update({download_links:n}).eq('id',current.id);if(r.error)return $('downloadMsg').textContent=r.error.message;downloads=n;renderDownloads()}$('search').addEventListener('input',()=>loadLibrary());$('refresh').addEventListener('click',()=>loadLibrary());$('library').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openAnime(b.dataset.id).catch(x=>showError(x.message))});$('season').addEventListener('change',renderEpisodes);$('saveEpisode').addEventListener('click',saveEpisode);$('cancel').addEventListener('click',()=>{editing=null;$('saveEpisode').textContent='ADD EPISODE';$('cancel').className='hidden';$('video').value='' });$('episodes').addEventListener('click',e=>{const a=e.target.closest('[data-edit]'),d=e.target.closest('[data-del]');if(a)editEpisode(a.dataset.edit);if(d)delEpisode(d.dataset.del)});$('publish').addEventListener('click',toggle);$('delete').addEventListener('click',delAnime);$('saveMovie').addEventListener('click',saveMovie);$('saveDownload').addEventListener('click',saveDownload);$('clearDownload').addEventListener('click',()=>{$('dSeason').value=1;$('d480').value='';$('d720').value='';$('d1080').value=''});$('downloadMsg').addEventListener('click',()=>{});$('downloads').addEventListener('click',e=>{const a=e.target.closest('[data-dedit]'),d=e.target.closest('[data-ddel]');if(a){const r=downloads[a.dataset.dedit]||{};$('dSeason').value=a.dataset.dedit;$('d480').value=r['480p']||'';$('d720').value=r['720p']||'';$('d1080').value=r['1080p']||''}if(d)delDownload(d.dataset.ddel)});init()})();
</script></body></html>
