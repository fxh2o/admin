<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniPasta Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#060911;--p:#0c1118;--b:#1a2840;--t:#c4d8ee;--m:#66829d;--g:#4ade80;--c:#38bdf8;--r:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.5 system-ui}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:15px;margin-bottom:14px}.row{display:flex;gap:7px}.row>*{flex:1}.input{width:100%;padding:9px;border:1px solid var(--b);background:#05080d;color:var(--t);border-radius:6px}.btn{border:1px solid var(--b);background:#101620;color:var(--t);padding:8px 12px;border-radius:6px;cursor:pointer}.btn.primary{color:var(--g);border-color:#315c46}.btn.danger{color:var(--r)}.item{display:flex;gap:9px;width:100%;text-align:left;background:#081018;border:1px solid var(--b);color:var(--t);padding:7px;border-radius:6px;margin-top:5px;cursor:pointer}.item img{width:35px;height:50px;object-fit:cover}.muted{color:var(--m);font-size:11px}.results{max-height:430px;overflow:auto}.msg{min-height:18px;margin-top:8px}.ok{color:var(--g)}.err{color:var(--r)}.hidden{display:none}.ep{padding:8px;border-bottom:1px solid var(--b)}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h2>AniPasta Admin</h2><div id="global" class="card">Connecting…</div><div class="grid"><aside><div class="card"><b>Anime Import</b><div class="row" style="margin-top:10px"><input id="q" class="input" placeholder="Search anime…"><button id="search" class="btn primary">Search</button></div><div id="msg" class="msg"></div><div id="results" class="results"></div></div><div class="card"><b>Library</b><div class="row" style="margin-top:10px"><input id="filter" class="input" placeholder="Filter"><button id="refresh" class="btn">↻</button></div><div id="library" class="results"></div></div></aside><main><div id="editor" class="card"><div class="muted">Select an anime from the library.</div></div></main></div></div><script>
const SUPA='https://ctcuocprqbbjkiptjerm.supabase.co', META=SUPA+'/functions/v1/metadata-search', TOKEN='anipasta-metadata-v1', KEY='anipasta_admin_local_key';let db=null,library=[],current=null,aniResults=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){let k=localStorage.getItem(KEY);if(!k){k=prompt('Enter your Supabase service_role key:')?.trim();if(k)localStorage.setItem(KEY,k)}return k||''}function init(){const k=key();if(!k){$('global').textContent='No key entered.';return}db=supabase.createClient(SUPA,k,{auth:{persistSession:false}});loadLibrary()}async function rq(p){const r=await p;if(r.error)throw new Error(r.error.message);return r}async function loadLibrary(){try{const r=await rq(db.from('anime').select('id,title,poster_url,is_published,content_type').order('title'));library=r.data||[];renderLibrary();$('global').textContent=`Online · ${library.length} anime`;$('global').className='card ok'}catch(e){$('global').textContent='Database error: '+e.message;$('global').className='card err'}}function renderLibrary(){const q=$('filter').value.trim().toLowerCase();const list=q?library.filter(x=>String(x.title).toLowerCase().includes(q)):library;$('library').innerHTML=list.map(a=>`<button class="item" data-id="${esc(a.id)}"><img src="${esc(a.poster_url||'')}" alt=""><span><b>${esc(a.title)}</b><br><small class="muted">${esc(a.content_type||'series')} · ${a.is_published?'published':'hidden'}</small></span></button>`).join('')||'<div class="muted">No anime.</div>'}
async function searchMeta(q){const r=await fetch(META,{method:'POST',headers:{'Content-Type':'application/json','x-anipasta-client':TOKEN},body:JSON.stringify({q})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.anilist?.message||j.jikan?.message||`Metadata HTTP ${r.status}`);return j}
async function searchAni(){const q=$('q').value.trim();if(!q)return;$('msg').textContent='Searching…';try{const j=await searchMeta(q);aniResults=j.results||[];$('msg').textContent=`${aniResults.length} result(s) · ${j.source||'metadata'}`;$('msg').className='msg ok';$('results').innerHTML=aniResults.map((a,i)=>`<button class="item" data-ani="${i}"><img src="${esc(a.coverImage?.large||'')}" alt=""><span><b>${esc(a.title?.english||a.title?.romaji||'Untitled')}</b><br><small class="muted">${a.source==='jikan'?'Jikan / MAL':'AniList'} · ${a.id?'AniList #'+a.id:'MAL #'+(a.mal_id||'—')}</small></span></button>`).join('')||'<div class="muted">No results.</div>'}catch(e){$('msg').textContent='Search failed: '+e.message;$('msg').className='msg err'}}
async function importAni(i){const a=aniResults[i];if(!a)return;const title=a.title?.english||a.title?.romaji||a.title?.native||'Untitled';try{let existing=[];if(a.id)existing=(await rq(db.from('anime').select('id,title').eq('anilist_id',a.id).limit(1))).data||[];if(!existing.length)existing=(await rq(db.from('anime').select('id,title').ilike('title','%'+title.replace(/[%_]/g,'')+'%').limit(10))).data||[];if(existing.length){openAnime(existing[0].id);$('msg').textContent='Already in library: '+existing[0].title;$('msg').className='msg ok';return}const payload={anilist_id:a.id||null,title,poster_url:a.coverImage?.large||null,is_published:true,content_type:String(a.format||'').toUpperCase()==='MOVIE'?'movie':'series'};const r=await rq(db.from('anime').insert(payload).select('id').single());$('msg').textContent='Imported: '+title;$('msg').className='msg ok';await loadLibrary();openAnime(r.data.id)}catch(e){$('msg').textContent='Import failed: '+e.message;$('msg').className='msg err'}}
async function openAnime(id){try{const r=await rq(db.from('anime').select('*').eq('id',id).single());current=r.data;const er=current.content_type==='movie'?'':`<h3>Episodes</h3><div class="row"><input id="sn" class="input" type="number" min="1" value="1"><input id="en" class="input" type="number" min="1" placeholder="Episode"><input id="vu" class="input" placeholder="Video URL"><button id="addEp" class="btn primary">Add</button></div><div id="eps" style="margin-top:10px"></div>`;$('editor').innerHTML=`<h2>${esc(current.title)}</h2><div class="muted">${esc(current.content_type||'series')} · AniList ${esc(current.anilist_id||'—')}</div><button id="toggle" class="btn" style="margin-top:10px">${current.is_published?'Unpublish':'Publish'}</button>${er}`;loadEpisodes();$('toggle').onclick=async()=>{await rq(db.from('anime').update({is_published:!current.is_published}).eq('id',current.id));openAnime(current.id);loadLibrary()};if($('addEp'))$('addEp').onclick=addEpisode}catch(e){$('editor').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
async function loadEpisodes(){if(!current||current.content_type==='movie')return;const r=await rq(db.from('episodes').select('id,season_number,episode_number,video_url').eq('anime_id',current.id).order('season_number').order('episode_number'));$('eps').innerHTML=(r.data||[]).map(e=>`<div class="ep">S${esc(e.season_number)} E${esc(e.episode_number)} — <span class="muted">${esc(e.video_url)}</span></div>`).join('')||'<div class="muted">No episodes.</div>'}
async function addEpisode(){try{const s=Number($('sn').value),e=Number($('en').value),u=$('vu').value.trim();if(!s||!e||!u)throw new Error('Season, episode and URL are required.');await rq(db.from('episodes').insert({anime_id:current.id,season_number:s,episode_number:e,title:'Episode '+e,video_url:u}));$('vu').value='';$('en').value='';await loadEpisodes()}catch(e){alert(e.message)}}
$('search').onclick=searchAni;$('q').onkeydown=e=>e.key==='Enter'&&searchAni();$('library').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openAnime(b.dataset.id)};$('results').onclick=e=>{const b=e.target.closest('[data-ani]');if(b)importAni(Number(b.dataset.ani))};$('filter').oninput=renderLibrary;$('refresh').onclick=loadLibrary;init();
</script></body></html>
